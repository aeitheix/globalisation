/* ---------- cloud save + revision history ---------- */
const API='/api/deck',hs=document.getElementById('hs');
let viewing=0,curTs=0,st=0,key='',cacheOK=1;
try{key=localStorage.getItem('glob-key')||''}catch(e){}
const stat=t=>document.getElementById('sv').textContent=t;
const fmt=ts=>new Date(ts).toLocaleString([],{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'});
function snap(){const c=dk.cloneNode(true);c.querySelectorAll('.gl').forEach(e=>e.classList.remove('gl'));c.querySelectorAll('#tg').forEach(e=>e.textContent='🌍 Tumble the barriers');return c.innerHTML}
function apply(html){dk.innerHTML=html;sl=[...dk.children];fit();go(Math.min(cur,sl.length-1))}
function sv(){if(viewing)return;clearTimeout(st);stat('● Saving…');st=setTimeout(()=>push(),1200)}
async function push(label,tries=0){
  const html=snap();try{localStorage.setItem('glob-deck-cache',html)}catch(e){}
  try{
    const r=await fetch(API+'?action=save',{method:'POST',headers:{'content-type':'application/json','x-edit-key':key},body:JSON.stringify({html,label:label||''})});
    if(r.status==401){const k=prompt('Enter the edit passcode to save changes:');if(k){key=k;try{localStorage.setItem('glob-key',k)}catch(e){}return push(label)}stat('⚠ Not saved (locked)');return}
    if(!r.ok)throw 0;const j=await r.json();curTs=j.ts;stat('✓ Saved '+fmt(j.ts))
  }catch(e){stat('⚠ Offline – retrying');if(tries<20)st=setTimeout(()=>push(label,tries+1),8000)}
}
async function sync(force){
  try{const r=await fetch(API+'?action=latest',{cache:'no-store'});if(!r.ok)throw 0;const j=await r.json();
    if(j.empty){stat('No cloud save yet');return}
    if(force||j.ts>curTs){apply(j.html);curTs=j.ts}stat('✓ Saved '+fmt(curTs))
  }catch(e){if(!curTs){try{const c=localStorage.getItem('glob-deck-cache');if(c)apply(c)}catch(_){}}stat('⚠ Offline')}
}
async function hist(){
  hs.classList.add('on');hs.innerHTML='<h2>Revision history</h2><p class="sub">Loading…</p>';
  let revs=[];try{revs=(await (await fetch(API+'?action=list',{cache:'no-store'})).json()).revs||[]}catch(e){hs.innerHTML='<h2>Revision history</h2><p class="sub">Could not load (offline?).</p><button class="b" onclick="hs.classList.remove(\'on\')">✕ Close</button>';return}
  hs.innerHTML='<h2>Revision history</h2>'+(viewing?'<p class="sub">👁 You are viewing an old version (read-only, nothing is saved).</p><button class="b" onclick="backCur()">↩ Back to current</button>':'')
   +'<div style="margin:10px 0"><button class="b" onclick="nameV()">💾 Save named version</button> <button class="b" onclick="hs.classList.remove(\'on\')">✕ Close</button></div>'
   +(revs.length?revs.map((r,i)=>`<div class="rv${i==0?' cu':''}"><div class="t">${i==0?'⭐ Current · ':''}${fmt(r.ts)}<small>${r.label?r.label.replace(/</g,'&lt;')+' · ':''}${Math.round(r.size/1024)} KB</small></div><button class="b" onclick="viewRev('${r.id}')">👁 Present</button><button class="b" onclick="restRev('${r.id}')">✔ Make current</button></div>`).join(''):'<p class="sub">No saved revisions yet. Edit something and it will appear here.</p>');
}
async function viewRev(id){const r=await (await fetch(API+'?action=get&id='+id)).json();apply(r.html);viewing=1;stat('👁 Viewing '+fmt(r.ts));hs.classList.remove('on')}
async function backCur(){viewing=0;await sync(true);hs.classList.remove('on')}
async function restRev(id){
  if(!confirm('Make this version the current one? Your latest version stays in history.'))return;
  try{const r=await fetch(API+'?action=restore',{method:'POST',headers:{'content-type':'application/json','x-edit-key':key},body:JSON.stringify({id})});
    if(r.status==401){const k=prompt('Enter the edit passcode:');if(k){key=k;try{localStorage.setItem('glob-key',k)}catch(e){}return restRev(id)}return}
    if(!r.ok)throw 0;viewing=0;await sync(true);hs.classList.remove('on')}catch(e){alert('Could not restore.')}
}
function nameV(){const l=prompt('Name this version (e.g. "Final for presentation"):');if(l)push(l).then(hist)}
function rst(){if(!confirm('Reset the deck to the original content? This is saved as a new revision, so you can undo it from History.'))return;viewing=0;apply(h);mn.classList.remove('on');push('Reset to original')}
document.getElementById('hi').onclick=hist;
addEventListener('keydown',e=>{if(e.key=='Escape'&&hs.classList.contains('on'))hs.classList.remove('on')});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&!ed&&!viewing)sync()});
addEventListener('pagehide',()=>{if(ed&&document.getElementById('sv').textContent.includes('Saving')){try{fetch(API+'?action=save',{method:'POST',keepalive:true,headers:{'content-type':'application/json','x-edit-key':key},body:JSON.stringify({html:snap()})})}catch(e){}}});
sync();
const cv=document.getElementById('cv'),g=cv.getContext('2d');let W,H,N=[];function rs(){W=cv.width=innerWidth;H=cv.height=innerHeight;N=Array.from({length:Math.min(42,W/22|0)},()=>({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.4,vy:(Math.random()-.5)*.4}))}rs();addEventListener('resize',rs);
(function f(){g.clearRect(0,0,W,H);N.forEach((a,i)=>{a.x=(a.x+a.vx+W)%W;a.y=(a.y+a.vy+H)%H;g.fillStyle='#22d3ee';g.beginPath();g.arc(a.x,a.y,2,0,7);g.fill();for(let j=i+1;j<N.length;j++){const b=N[j],d=Math.hypot(a.x-b.x,a.y-b.y);if(d<140){g.strokeStyle='rgba(34,211,238,'+(.28-d/600)+')';g.beginPath();g.moveTo(a.x,a.y);g.lineTo(b.x,b.y);g.stroke()}}});requestAnimationFrame(f)})();
